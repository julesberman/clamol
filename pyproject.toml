[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clamol"
version = "0.1.0"
description = "MCP server exposing PyMOL via its built-in XML-RPC bridge"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jules Berman", email = "jberman@genesistherapeutics.ai" }]
keywords = ["mcp", "pymol", "structural-biology", "claude"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "mcp[cli]>=1.2",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
clamol = "clamol.server:main"
clamol-launch-pymol = "clamol.server:launch_pymol_cli"

[project.urls]
Homepage = "https://github.com/julesberman/clamol"
Issues = "https://github.com/julesberman/clamol/issues"
